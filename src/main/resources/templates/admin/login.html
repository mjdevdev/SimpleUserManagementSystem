<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin login - Simple User Management</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center px-4">

<main class="bg-slate-800 shadow-lg rounded-2xl p-10 w-full max-w-md">
    <h1 class="text-2xl font-bold text-white mb-1 text-center">Admin Panel</h1>
    <p class="text-slate-400 text-sm mb-8 text-center">Administrator sign-in required</p>

    <p th:if="${param.error}"
       class="mb-4 text-sm text-red-400 bg-red-950 border border-red-800 rounded-lg px-4 py-2">
        Invalid credentials or not an administrator.
    </p>
    <p th:if="${param.logout}"
       class="mb-4 text-sm text-emerald-400 bg-emerald-950 border border-emerald-800 rounded-lg px-4 py-2">
        You have been logged off from the admin panel.
    </p>

    <form th:action="@{/admin/login}" method="post" class="space-y-4">
        <div>
            <label for="username" class="block text-sm font-medium text-slate-300 mb-1">Username</label>
            <input type="text" id="username" name="username" required autofocus
                   class="w-full rounded-lg border border-slate-600 bg-slate-700 text-white px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
        </div>
        <div>
            <label for="password" class="block text-sm font-medium text-slate-300 mb-1">Password</label>
            <input type="password" id="password" name="password" required
                   class="w-full rounded-lg border border-slate-600 bg-slate-700 text-white px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
        </div>
        <button type="submit"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition">
            Sign in as admin
        </button>
    </form>

    <p class="text-sm text-slate-500 text-center mt-6">
        <a th:href="@{/}" class="hover:text-slate-300">← Back to site</a>
    </p>
</main>

</body>
</html>
