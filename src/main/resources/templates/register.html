<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Simple User Management</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center px-4">

<main class="bg-white shadow-lg rounded-2xl p-10 w-full max-w-md">
    <h1 class="text-2xl font-bold text-slate-800 mb-6 text-center">Create an account</h1>

    <p th:if="${param.oauth}"
       class="mb-4 text-sm text-indigo-700 bg-indigo-50 border border-indigo-200 rounded-lg px-4 py-2">
        Finishing sign-up with <b th:text="${param.oauth}">google</b> as
        <b th:text="${param.email}">email</b> — just pick a nickname and submit.
    </p>

    <p th:if="${error}"
       class="mb-4 text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg px-4 py-2"
       th:text="${error}">
        error
    </p>

    <form th:action="@{/register}" method="post" class="space-y-4">
        <!-- Carried over from the Google callback when registering via OAuth2 -->
        <input type="hidden" name="oauthProvider" th:value="${form != null ? form.oauthProvider : param.oauth}">
        <input type="hidden" name="oauthHandle" th:value="${form != null ? form.oauthHandle : param.handle}">
        <input type="hidden" name="oauthAvatar" th:value="${form != null ? form.oauthAvatar : param.avatar}">

        <div th:unless="${param.oauth}">
            <label for="username" class="block text-sm font-medium text-slate-700 mb-1">Username</label>
            <input type="text" id="username" name="username" required autofocus minlength="3" maxlength="50"
                   th:value="${form != null ? form.username : ''}"
                   class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
        </div>
        <div>
            <label for="nickname" class="block text-sm font-medium text-slate-700 mb-1">Nickname</label>
            <input type="text" id="nickname" name="nickname" maxlength="100"
                   th:value="${form != null ? form.nickname : param.nickname}"
                   class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
        </div>
        <div>
            <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email</label>
            <input type="email" id="email" name="email" th:readonly="${param.oauth}"
                   th:value="${form != null ? form.email : param.email}"
                   class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 disabled:bg-slate-100 disabled:text-slate-500">
        </div>
        <div th:unless="${param.oauth}">
            <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
            <input type="password" id="password" name="password" required minlength="8"
                   class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
        </div>
        <button type="submit"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition">
            Register
        </button>
    </form>

    <div th:unless="${param.oauth}" class="contents">
        <div class="flex items-center my-6">
            <div class="flex-grow border-t border-slate-200"></div>
            <span class="px-3 text-xs text-slate-400 uppercase">or</span>
            <div class="flex-grow border-t border-slate-200"></div>
        </div>

        <a th:href="@{/oauth2/authorization/google}"
           class="block w-full text-center bg-white hover:bg-slate-50 text-slate-700 font-semibold py-2.5 rounded-lg border border-slate-300 transition">
            Sign up with Google
        </a>
    </div>

    <p class="text-sm text-slate-500 text-center mt-6">
        Already have an account?
        <a th:href="@{/login}" class="text-indigo-600 hover:underline font-medium">Log in</a>
    </p>
</main>

</body>
</html>
